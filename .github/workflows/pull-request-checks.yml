name: Pull Request Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: forest-workshop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Forest Workshop validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and lint
        run: npm run check
      - name: Check package source
        run: npm run typecheck:packages
      - name: Test Forest Workshop
        run: npm run test:forest-workshop
      - name: Validate catalog and locales
        run: |
          node scripts/test-catalog-lanes.mjs
          node scripts/validate-package-locales.mjs
          node scripts/validate-catalog.mjs
          node scripts/tests/catalog-release-notes.regression.mjs
